<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* The specificity of this selector is 1  */
        h1 {
            color: cadetblue;
        }
        /* The specificity of this selector is 10  */
        .cpurple {
            color: purple;
        }

        /* The specificity of this selector is 1 + 10 = 11 */
        h1.yellow {
         color: chartreuse;
        }
        [data-x=a] {
            color: maroon;
        }
        .cred {
            color: red;
        }

        a.mishalclass.zihad-class[href]{
            color: darkgreen;
        }
    </style>
</head>

<body>
    <div>
        <h1 class="yellow cred cpurple" data-x="a">CSS Specificity</h1>
    </div>
    
<a href="https://Google.com" class="mishalclass zihad-class">Enter Google</a>
</body>

</html>
