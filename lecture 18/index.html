<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 <style>
    .box{
        background-color: cadetblue;
    }
    .box1{
        background-color: brown;
        padding: 20px;
        margin: 10px;
        border: 50px solid yellowgreen;
        height: 100px;
        box-sizing: border-box;
    }
    .box2{
        background-color: darkolivegreen;
        padding: 15px;
        margin: 8px;
        border-color: coral;
        border: 10px solid blueviolet;
        height 500px; 
        box-sizing: border-box;
        color: darkred;
    }
    .box3{
        background-color: brown;
        padding: 10px;
        margin: 25px;
        border: 2px solid black;
        height: 200px;
        box-sizing: border-box;
    }

 </style>
</head>
<body>
    <div class="box box1">i am a div</div>
    <div class="box box2">I am another div</div>
    <div class="box box3">I am also a div</div>
    <div class="box">Thats the moral of the story</div>
</body>
</html>
